name: framework-agent-lab-wsl
services:
  lab:
    build:
      context: .
      dockerfile: Dockerfile.wsl
    gpus: all
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /models
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NOPRUNE: "true"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - model-cache:/models
      - type: bind
        source: ${OLLAMA_MODELS_DIR:-./.wsl-models}
        target: /import-models
        read_only: true
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5m
    stop_grace_period: 15s
volumes:
  model-cache:
